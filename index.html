<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#130d1d" />
    <title>Su día especial se acerca</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap");

      :root {
        color-scheme: dark;
        --night: #0c0913;
        --plum: #1a1023;
        --plum-light: #3c2348;
        --pink: #f1b8d8;
        --pink-light: #ffeaf7;
        --muted: #c4adbf;
        --glass: rgba(255, 230, 249, 0.1);
        --line: rgba(248, 205, 233, 0.25);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }

      body {
        min-width: 320px;
        margin: 0;
        overflow-x: hidden;
        background: var(--night);
        color: var(--pink-light);
        font-family: "Montserrat", sans-serif;
      }

      button { font: inherit; }

      .page {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 5%, rgba(101, 45, 123, 0.45), transparent 33rem),
          linear-gradient(180deg, #150d1d 0%, #0d0914 45%, #170d20 100%);
      }

      .scene {
        position: relative;
        z-index: 1;
        display: none;
        min-height: 100vh;
        padding: 2rem 1.5rem;
      }

      .scene.is-active {
        display: block;
        animation: sceneIn 0.75s cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .hero-scene {
        text-align: center;
        padding: 0 0 4.5rem;
      }

      .hero-media {
        position: relative;
        width: 100%;
        height: min(74vh, 44rem);
        overflow: hidden;
      }

      .hero-portrait {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }

      .hero-media-fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(21, 13, 29, 0) 0%,
          rgba(21, 13, 29, 0) 60%,
          rgba(76, 40, 95, 0.3) 80%,
          #150d1d 100%
        );
        pointer-events: none;
      }

      .hero-content {
        position: relative;
        z-index: 1;
        width: min(100%, 52rem);
        margin: -3rem auto 0;
        padding: 0 1.5rem;
        text-align: center;
      }

      .eyebrow {
        margin-bottom: 1rem;
        color: var(--pink);
        font-size: clamp(0.7rem, 1vw, 0.85rem);
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", Georgia, serif;
        color: var(--pink-light);
        font-size: clamp(3rem, 8vw, 6rem);
        line-height: 1;
      }

      .hero-subtitle {
        max-width: 31rem;
        margin: 1.5rem auto;
        color: var(--muted);
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(1.1rem, 2vw, 1.4rem);
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, minmax(4rem, 6rem));
        justify-content: center;
        gap: 1rem;
        margin: 2rem auto;
      }

      .time-unit {
        display: grid;
        gap: 0.5rem;
        justify-items: center;
      }

      .time-value {
        display: grid;
        min-height: 4.5rem;
        width: 100%;
        place-items: center;
        border: 1px solid rgba(253, 215, 241, 0.32);
        border-radius: 0.72rem;
        background: rgba(255, 224, 246, 0.1);
        color: var(--pink-light);
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 2.5rem;
        font-weight: 700;
        backdrop-filter: blur(4px);
      }

      .time-label {
        color: rgba(251, 212, 239, 0.72);
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      @keyframes sceneIn {
        from { opacity: 0; transform: translateY(1rem); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>

    <!-- Reproductor de audio -->
    <audio id="bg-audio" loop preload="auto">
      <source src="musica.mp3" type="audio/mpeg" />
    </audio>

    <div class="page">
      <main>
        <section class="scene hero-scene is-active" id="inicio">
          <div class="hero-media">
            <!-- Imagen ajustada en resolución y encuadre -->
            <img 
              class="hero-portrait" 
              src="foto.jpg" 
              alt="Fotografía principal" 
            />
            <div class="hero-media-fade"></div>
          </div>

          <div class="hero-content">
            <p class="eyebrow">Próximamente</p>
            <h1>Su día especial <span>se acerca</span></h1>
            <p class="hero-subtitle">Un momento inolvidable está por comenzar...</p>

            <div class="countdown">
              <div class="time-unit">
                <div class="time-value" id="days">00</div>
                <span class="time-label">Días</span>
              </div>
              <div class="time-unit">
                <div class="time-value" id="hours">00</div>
                <span class="time-label">Horas</span>
              </div>
              <div class="time-unit">
                <div class="time-value" id="minutes">00</div>
                <span class="time-label">Min</span>
              </div>
              <div class="time-unit">
                <div class="time-value" id="seconds">00</div>
                <span class="time-label">Seg</span>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      // Activación del sonido al primer clic o toque
      const audio = document.getElementById('bg-audio');
      
      function playAudio() {
        if (audio) {
          audio.play().catch(error => {
            console.log("El navegador requiere interacción previa para sonido:", error);
          });
        }
        document.removeEventListener('click', playAudio);
        document.removeEventListener('touchstart', playAudio);
      }

      document.addEventListener('click', playAudio);
      document.addEventListener('touchstart', playAudio);

      // Configuración del contador de tiempo
      const targetDate = new Date("2026-12-31T00:00:00").getTime();

      function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference > 0) {
          const days = Math.floor(difference / (1000 * 60 * 60 * 24));
          const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((difference % (1000 * 60)) / 1000);

          document.getElementById("days").innerText = String(days).padStart(2, "0");
          document.getElementById("hours").innerText = String(hours).padStart(2, "0");
          document.getElementById("minutes").innerText = String(minutes).padStart(2, "0");
          document.getElementById("seconds").innerText = String(seconds).padStart(2, "0");
        }
      }

      setInterval(updateCountdown, 1000);
      updateCountdown();
    </script>
  </body>
</html>
