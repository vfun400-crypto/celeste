<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Feliz cumpleaños!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 40%, #1a0b2e 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Fondo con brillos sutiles */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 105, 180, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(147, 112, 219, 0.15), transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.2rem, 10vw, 6.5rem);
      font-weight: 700;
      line-height: 1.1;
      background: linear-gradient(135deg, #ff9ed2, #ff6eb4, #c77dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(255, 110, 180, 0.3);
      animation: titleIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .subtitle {
      margin-top: 1.2rem;
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: rgba(255, 220, 240, 0.85);
      font-weight: 400;
      letter-spacing: 0.05em;
      animation: titleIn 1.2s 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    /* ── Globos ── */
    .balloon {
      position: fixed;
      bottom: -120px;
      width: 60px;
      height: 75px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      z-index: 5;
      opacity: 0.9;
      animation: rise linear forwards;
    }

    .balloon::before {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 40px;
      background: rgba(255, 255, 255, 0.6);
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 10px;
      background: inherit;
      border-radius: 0 0 50% 50%;
      filter: brightness(0.85);
    }

    /* Colores de globos */
    .balloon.pink   { background: linear-gradient(145deg, #ff8ec8, #ff4d9e); }
    .balloon.purple { background: linear-gradient(145deg, #c77dff, #9b5de5); }
    .balloon.blue   { background: linear-gradient(145deg, #7bdff2, #4cc9f0); }
    .balloon.yellow { background: linear-gradient(145deg, #ffe066, #ffd166); }
    .balloon.coral  { background: linear-gradient(145deg, #ff9a8b, #ff6b6b); }
    .balloon.mint   { background: linear-gradient(145deg, #98f5e1, #64dfdf); }

    /* Explosión */
    .balloon.pop {
      animation: pop 0.4s ease-out forwards;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(15deg);
        opacity: 0;
      }
    }

    @keyframes pop {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.4);
        opacity: 0.8;
      }
      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    @keyframes titleIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Partículas de confeti al explotar */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 6;
      animation: particleFly 0.8s ease-out forwards;
    }

    @keyframes particleFly {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>¡Feliz<br>cumpleaños!</h1>
    <p class="subtitle">Que este día esté lleno de alegría ✨</p>
  </div>

  <script>
    const colors = ['pink', 'purple', 'blue', 'yellow', 'coral', 'mint'];
    const particleColors = ['#ff8ec8', '#c77dff', '#7bdff2', '#ffe066', '#ff9a8b', '#98f5e1', '#ff6eb4'];

    function createBalloon() {
      const balloon = document.createElement('div');
      balloon.className = `balloon ${colors[Math.floor(Math.random() * colors.length)]}`;
      
      // Posición horizontal aleatoria
      const left = Math.random() * 100;
      balloon.style.left = `${left}vw`;
      
      // Tamaño aleatorio
      const size = 45 + Math.random() * 40;
      balloon.style.width = `${size}px`;
      balloon.style.height = `${size * 1.25}px`;
      
      // Duración de subida aleatoria
      const duration = 4 + Math.random() * 5;
      balloon.style.animationDuration = `${duration}s`;
      
      // Retraso aleatorio
      balloon.style.animationDelay = `${Math.random() * 0.8}s`;

      document.body.appendChild(balloon);

      // Posibilidad de que explote mientras sube
      const popTime = (1.5 + Math.random() * (duration - 2)) * 1000;
      
      setTimeout(() => {
        if (balloon.parentElement) {
          explodeBalloon(balloon);
        }
      }, popTime);

      // Eliminar cuando termine la animación
      setTimeout(() => {
        balloon.remove();
      }, (duration + 1) * 1000);
    }

    function explodeBalloon(balloon) {
      const rect = balloon.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      // Crear partículas
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.background = particleColors[Math.floor(Math.random() * particleColors.length)];
        
        const angle = (i / 12) * Math.PI * 2;
        const distance = 40 + Math.random() * 60;
        particle.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
        particle.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
        
        document.body.appendChild(particle);
        
        setTimeout(() => particle.remove(), 800);
      }

      // Animación de pop del globo
      balloon.classList.add('pop');
      setTimeout(() => balloon.remove(), 400);
    }

    // Crear muchos globos al inicio
    function startBalloons() {
      // Primeros globos inmediatos
      for (let i = 0; i < 18; i++) {
        setTimeout(() => createBalloon(), i * 120);
      }

      // Seguir generando globos durante un rato
      const interval = setInterval(() => {
        createBalloon();
      }, 600);

      // Detener después de 12 segundos
      setTimeout(() => clearInterval(interval), 12000);
    }

    // Iniciar apenas carga la página
    startBalloons();
  </script>
</body>
</html>
